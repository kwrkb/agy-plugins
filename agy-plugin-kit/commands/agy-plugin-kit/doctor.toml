description = "プラグインを診断し、検出した問題を修正する（agy plugin validate + Issue #390 の ./ 相対パスへの書き換えを含む）"
prompt = """
agy プラグインを診断して修正します。対象パス: {{args}}。

手順:
1. キット固有のトラップ検査（ソース・install 先とも実行可）:
   `~/.gemini/config/plugins/agy-plugin-kit/validator/bin/validator <対象>`（dispatcher。Windows は `bin/validator.exe`）。
2. agy 公式の健全性チェック: `agy plugin validate <対象>`（`agy doctor` は存在しないので使わない）。
   - **注意（agy 1.4.0〜）**: `agy plugin validate` は `plugin.json` を直接要求する。legacy の `gemini-extension.json` 形式のソースに直接かけると `no plugin.json found` エラーになるので、その場合は install 先（`~/.gemini/config/plugins/<name>`）にかけ、ソースは native 形式への移行を提案する。
3. 検出した各問題を、skill `agy-plugin-authoring` の規則に対応づけて修正案を提示する。代表的な修正:
   - **C2 / Issue #390・`command` 変数未展開**:
     - MCP の `command` フィールド自体で `${PLUGIN_ROOT}` / `${PLUGIN_DATA}` を使用している場合（`mcp_config.json`・`gemini-extension.json` のどちらでも）:
       `--fix-paths` は `${PLUGIN_ROOT}` を置換しないので手で直す。native 形式の `mcp_config.json` にし、`command` をプラグインルート相対の `./bin/<name>` へ書き換える（legacy の `gemini-extension.json` 形式なら、`plugin.json` + `mcp_config.json` へ移す。install は `${PLUGIN_ROOT}` を展開しない）。
     - native `plugin.json` の `mcp_config.json` で `${extensionPath}` を使用している場合（Issue #390）:
       ユーザー合意のうえ `validator/bin/validator --fix-paths <対象>` を実行し、`${extensionPath}${/}` を `./` 相対へ書き換える。
       書き換え後は機械に依存しないので、ソースに対して実行してよい（install 先に実行しても、次の install で元に戻る）。
   - **C3**（`.sh`/`.cmd`/`.bat` を command 直指定）: Go `.exe` ラッパー＋拡張子なし dispatcher 化を提案。
   - **C4**（同梱バイナリが gitignore 対象）: `.gitignore` を修正し対象を明示コミットする。
   - **C8**（`${CLAUDE_PLUGIN_ROOT}`）: agy には無いので除去し、MCP `args`/`env` なら `${PLUGIN_ROOT}`、同梱バイナリ `command` なら native `mcp_config.json` の `./bin/<name>` へ。
   - **C10**（`hooks.json` で変数使用）: `hooks.json` では `${extensionPath}` も `${PLUGIN_ROOT}` も展開されないため、プラグインルートからの PWD 相対パスへ書き換える。
   - **C6**（同梱バイナリの `command` に `.exe`）: 拡張子を外す。Windows は agy が `.exe` を補い、Linux / macOS は dispatcher が起動する。
   - **C11**（`hooks.json` の `timeout` が長すぎる）: agy の `timeout` は秒単位。ミリ秒のつもりで書いた値なら 1000 で割った秒数に直す（例: `10000` → `10`）。
4. 破壊的な書き換え（--fix-paths や .gitignore 変更）は実行前に必ず差分と意図を説明し、同意を取る。
5. 修正後に再度 validator を実行して 0 エラーを確認する。
"""
